name: Public site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit, tag, or branch to redeploy
        required: true
        default: main
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1 # v1
      # The documentation pages are generated from content/ and from the built
      # package, so both have to exist before the site is uploaded.
      - run: npm run build
      - run: npm run build:docs
      - run: npm run check:site
      - run: npm run check:docs
      - name: Record the immutable deployment revision
        run: git rev-parse HEAD
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
