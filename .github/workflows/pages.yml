name: Public site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit, tag, or branch to redeploy
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    # This repository is public and the capacity router is a reusable workflow
    # in the private .github-private, which a public caller cannot resolve.
    # Target the ultra pool directly until the router is published somewhere a
    # public repository can reach.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@49c5ceb7e97bd33b567513b3135e0eb5525d89e5
      - name: Check out the exact requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@49c5ceb7e97bd33b567513b3135e0eb5525d89e5 # v1 # v1
      # The documentation pages are generated from content/ and from the built
      # package, so both have to exist before the site is uploaded.
      - run: npm run build
      - run: npm run build:docs
      - run: npm run check:site
      - run: npm run check:docs
      - name: Record the immutable deployment revision
        run: git rev-parse HEAD
      - name: Publish to the gh-pages branch
        # Branch publishing keeps the site out of Actions artifact storage,
        # which the Free plan shares with private packages and is full.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Publish ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -qf "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
