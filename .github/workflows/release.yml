name: Release package

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # This repository is public and the capacity router is a reusable workflow
    # in the private .github-private, which a public caller cannot resolve.
    # Target the ultra pool directly until the router is published somewhere a
    # public repository can reach.
    runs-on: [self-hosted, linux-ultra]
    environment: npm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run ci
      - run: npm publish --access public --provenance
